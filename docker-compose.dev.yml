services:
  web-dev:
    image: jbalibrea-web-dev
    build: 
      context: .
      dockerfile: dev.Dockerfile
    environment:
      PUBLIC_CONTACT_ENDPOINT: ${PUBLIC_CONTACT_ENDPOINT}
      PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY}
    volumes:
      - ./:/app
    expose:
      - "4321"
    ports:
      - "4321:4321"
