name: CI/CD - Build, Push, Deploy 🐳
run-name: Deploy ${{ github.ref_name }} (${{ github.actor }})
on:
  push:
    branches:
      - main
      - develop
      - feat/*
      - chore/*
      - refactor/*

# Un solo despliegue a la vez por entorno. En staging un push nuevo cancela el
# anterior; en producción nunca se cancela a mitad de despliegue.
concurrency:
  group: deploy-${{ github.ref_name == 'main' && 'production' || 'staging' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

env:
  IS_PROD: ${{ github.ref_name == 'main' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: `latest` en main, `pre` en el resto, y siempre el SHA completo
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/jbalibreadev-web
          tags: |
            type=raw,value=latest,enable=${{ env.IS_PROD == 'true' }}
            type=raw,value=pre,enable=${{ env.IS_PROD != 'true' }}
            type=sha,format=long,prefix=

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLIC_CONTACT_ENDPOINT=${{ secrets.PUBLIC_CONTACT_ENDPOINT }}
            PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Determine compose file
        id: compose
        run: |
          if [[ "$IS_PROD" == "true" ]]; then
            echo "file=docker-compose.yml" >> "$GITHUB_OUTPUT"
          else
            echo "file=docker-compose.pre.yml" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          COMPOSE_FILE: ${{ steps.compose.outputs.file }}
        with:
          envs: GHCR_USER,GHCR_TOKEN,COMPOSE_FILE
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ${{ secrets.VPS_PROJECT_PATH }}
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "Deploying with $COMPOSE_FILE"
            docker compose -f "$COMPOSE_FILE" pull
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate
            echo "Deployment completed"

            export PATH="$HOME/.local/bin:$PATH"
            if command -v docker-clean > /dev/null; then
              docker-clean || echo "docker-clean falló (se ignora)"
            else
              echo "docker-clean no está instalado o no está en PATH"
            fi
