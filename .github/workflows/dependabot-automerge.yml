name: Dependabot auto-merge 🤖
# Activa el auto-merge solo en PRs de Dependabot que sean npm y minor/patch.
# GitHub las mergea cuando pasan los checks obligatorios (ver ci.yml, job "build").
# Los majors y las GitHub Actions se revisan y mergean a mano.
on:
  pull_request:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (npm, minor/patch)
        if: >-
          steps.metadata.outputs.package-ecosystem == 'npm_and_yarn' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
           steps.metadata.outputs.update-type == 'version-update:semver-patch')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
